<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | {{ event_name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  body { background:#030712; color:#fff; font-family:'Inter',sans-serif; min-height:100vh; }
  .display { font-family:'Space Grotesk',sans-serif; }
  .glass { background:rgba(15,23,42,.5); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.08); }
  .grad { background-image:linear-gradient(to right,#22d3ee,#a855f7); }
  .option-card { background:rgba(3,7,18,.6); border:1px solid rgba(255,255,255,.12); cursor:pointer; transition:all .15s ease; }
  .option-card:hover { border-color:#22d3ee; transform:translateY(-2px); }
  .option-card.selected { border-color:#22d3ee; box-shadow:0 0 0 2px rgba(34,211,238,.35); background:rgba(34,211,238,.06); }
</style>
</head>
<body class="flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <p class="text-cyan-400 text-xs tracking-[0.3em] uppercase mb-1">Step 1 of 4</p>
      <h1 class="display text-3xl font-bold">Register for <span class="bg-clip-text text-transparent grad">{{ event_name }}</span></h1>
      <p class="text-gray-400 text-sm mt-2">Choose which track you're registering for.</p>
    </div>

    <form method="POST" class="glass rounded-2xl p-6 sm:p-8 space-y-4">
      {% if error %}
        <div class="bg-red-500/10 border border-red-500/40 text-red-300 text-sm rounded-lg px-4 py-3">{{ error }}</div>
      {% endif %}

      <label class="option-card rounded-xl p-5 flex items-center gap-4 block">
        <input type="radio" name="category" value="technical" required class="w-5 h-5 accent-cyan-400">
        <div>
          <p class="font-bold">Technical</p>
          <p class="text-xs text-gray-400">Coding, hackathons, technical paper &amp; project events</p>
        </div>
      </label>

      <label class="option-card rounded-xl p-5 flex items-center gap-4 block">
        <input type="radio" name="category" value="non-technical" required class="w-5 h-5 accent-cyan-400">
        <div>
          <p class="font-bold">Non-Technical</p>
          <p class="text-xs text-gray-400">Gaming, creative &amp; fun events</p>
        </div>
      </label>

      <button type="submit"
        class="w-full grad text-white font-bold py-3 rounded-lg tracking-wide hover:opacity-90 transition">
        Continue
      </button>
    </form>

    <p class="text-center text-xs text-gray-600 mt-6">
      <a href="/" class="hover:text-gray-400">&larr; Back to home</a>
    </p>
  </div>

<script>
  document.querySelectorAll('.option-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    });
  });
</script>
</body>
</html>
