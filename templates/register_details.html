<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | {{ event_name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  body { background:#030712; color:#fff; font-family:'Inter',sans-serif; min-height:100vh; }
  .display { font-family:'Space Grotesk',sans-serif; }
  .glass { background:rgba(15,23,42,.5); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.08); }
  .grad { background-image:linear-gradient(to right,#22d3ee,#a855f7); }
  input, select { background:rgba(3,7,18,.6); border:1px solid rgba(255,255,255,.12); color:#fff; }
  input:focus, select:focus { outline:none; border-color:#22d3ee; box-shadow:0 0 0 2px rgba(34,211,238,.25); }
  select option { background:#0f172a; }
</style>
</head>
<body class="flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <p class="text-cyan-400 text-xs tracking-[0.3em] uppercase mb-1">Step 2 of 4</p>
      <h1 class="display text-3xl font-bold">Register for <span class="bg-clip-text text-transparent grad">{{ event_name }}</span></h1>
      <p class="text-gray-400 text-sm mt-2">
        {{ category|capitalize }} track &mdash; enter your details to continue.
      </p>
    </div>

    <form method="POST" class="glass rounded-2xl p-6 sm:p-8 space-y-4">
      {% if error %}
        <div class="bg-red-500/10 border border-red-500/40 text-red-300 text-sm rounded-lg px-4 py-3">{{ error }}</div>
      {% endif %}

      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-400 mb-1">Event</label>
        <select name="event" required class="w-full rounded-lg px-4 py-3 text-sm">
          <option value="" disabled {{ '' if selected_event else 'selected' }}>Select an event</option>
          {% for ev in events %}
            <option value="{{ ev }}" {{ 'selected' if ev == selected_event else '' }}>{{ ev }}</option>
          {% endfor %}
        </select>
        <p class="text-[11px] text-gray-500 mt-1">This is the event you're registering for &mdash; double check it's right.</p>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-400 mb-1">Full Name</label>
        <input type="text" name="name" required value="{{ values.name if values else '' }}"
               class="w-full rounded-lg px-4 py-3 text-sm" placeholder="Your full name">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-400 mb-1">Registration Number</label>
        <input type="text" name="reg_no" required value="{{ values.reg_no if values else '' }}"
               class="w-full rounded-lg px-4 py-3 text-sm" placeholder="e.g. 21CS045">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-400 mb-1">College Name</label>
        <input type="text" name="college" required value="{{ values.college if values else '' }}"
               class="w-full rounded-lg px-4 py-3 text-sm" placeholder="Your college name">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-400 mb-1">Department</label>
        <input type="text" name="department" required value="{{ values.department if values else '' }}"
               class="w-full rounded-lg px-4 py-3 text-sm" placeholder="e.g. CSE, ECE, AI &amp; DS">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-400 mb-1">Mobile Number</label>
        <input type="tel" name="mobile" required maxlength="10" pattern="[0-9]{10}" inputmode="numeric"
               value="{{ values.mobile if values else '' }}"
               class="w-full rounded-lg px-4 py-3 text-sm" placeholder="10-digit mobile number">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-gray-400 mb-1">Email Address</label>
        <input type="email" name="email" required value="{{ values.email if values else '' }}"
               class="w-full rounded-lg px-4 py-3 text-sm" placeholder="you@example.com">
        <p class="text-[11px] text-gray-500 mt-1">We'll send a 6-digit verification code to this address.</p>
      </div>

      <button type="submit"
        class="w-full grad text-white font-bold py-3 rounded-lg tracking-wide hover:opacity-90 transition">
        Send Verification Code
      </button>
    </form>

    <p class="text-center text-xs text-gray-600 mt-6">
      <a href="/register" class="hover:text-gray-400">&larr; Back</a>
    </p>
  </div>
</body>
</html>
