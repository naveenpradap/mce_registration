<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment | {{ event_name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  body { background:#030712; color:#fff; font-family:'Inter',sans-serif; min-height:100vh; }
  .display { font-family:'Space Grotesk',sans-serif; }
  .glass { background:rgba(15,23,42,.5); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.08); }
  .grad { background-image:linear-gradient(to right,#22d3ee,#a855f7); }
  input { background:rgba(3,7,18,.6); border:1px solid rgba(255,255,255,.12); color:#fff; }
  input:focus { outline:none; border-color:#22d3ee; box-shadow:0 0 0 2px rgba(34,211,238,.25); }
  input[type=file] { padding:.5rem; }
</style>
</head>
<body class="flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <p class="text-cyan-400 text-xs tracking-[0.3em] uppercase mb-1">Step 4 of 4</p>
      <h1 class="display text-3xl font-bold">Complete Payment</h1>
      <p class="text-gray-400 text-sm mt-2">Scan, pay, then confirm below, {{ reg_data.name }}.</p>
      <p class="text-xs text-cyan-400 mt-1 uppercase tracking-wide">{{ reg_data.event }} &middot; {{ reg_data.category|capitalize }}</p>
    </div>

    <div class="glass rounded-2xl p-6 sm:p-8 space-y-6">
      {% if error %}
        <div class="bg-red-500/10 border border-red-500/40 text-red-300 text-sm rounded-lg px-4 py-3">{{ error }}</div>
      {% endif %}

      <div class="flex flex-col items-center gap-2">
        <div class="bg-white p-3 rounded-xl">
          <img src="/static/gpay-qr.png" alt="GPay QR Code" class="w-48 h-48 object-contain" onerror="this.src='https://placehold.co/200x200/png?text=Add+GPay+QR'">
        </div>
        <p class="text-xs text-gray-500">Scan with any UPI app, or pay to:</p>
        <p class="text-sm font-mono text-cyan-300">sanjay132726-1@okicici</p>
      </div>

      <form method="POST" enctype="multipart/form-data" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-gray-400 mb-1">UPI / Transaction ID</label>
          <input type="text" name="transaction_id" required class="w-full rounded-lg px-4 py-3 text-sm" placeholder="e.g. 123456789012">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-gray-400 mb-1">Payment Screenshot</label>
          <input type="file" name="screenshot" accept="image/png,image/jpeg,image/webp" required class="w-full rounded-lg text-sm">
        </div>

        <button type="submit"
          class="w-full grad text-white font-bold py-3 rounded-lg tracking-wide hover:opacity-90 transition">
          Submit Registration
        </button>
      </form>
    </div>
  </div>
</body>
</html>
