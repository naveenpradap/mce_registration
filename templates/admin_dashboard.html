<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | {{ event_name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  body { background:#030712; color:#fff; font-family:'Inter',sans-serif; }
  .display { font-family:'Space Grotesk',sans-serif; }
  .glass { background:rgba(15,23,42,.5); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.08); }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#94a3b8; padding:10px 12px; }
  td { padding:10px 12px; font-size:13px; border-top:1px solid rgba(255,255,255,.06); vertical-align:middle; }
  .badge { padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; text-transform:uppercase; }
  .badge-pending { background:rgba(234,179,8,.15); color:#eab308; }
  .badge-approved { background:rgba(34,197,94,.15); color:#22c55e; }
  .badge-rejected { background:rgba(239,68,68,.15); color:#ef4444; }
  select { background:#0f172a; border:1px solid rgba(255,255,255,.15); color:#fff; font-size:12px; border-radius:6px; padding:4px 8px; }
  .dot { width:7px; height:7px; border-radius:50%; background:#22c55e; box-shadow:0 0 8px #22c55e; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
</style>
</head>
<body class="min-h-screen px-4 sm:px-8 py-8">
  <div class="max-w-6xl mx-auto">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="display text-2xl font-bold">{{ event_name }} — Registrations</h1>
        <p class="text-xs text-gray-500 flex items-center gap-2 mt-1">
          <span class="dot"></span> Live · updates every few seconds
          <span id="count-label" class="text-gray-400"></span>
        </p>
      </div>
      <div class="flex items-center gap-3">
        <select id="category-filter" class="bg-[#0f172a] border border-white/10 rounded-lg px-3 py-2 text-xs">
          <option value="">All Tracks</option>
          <option value="technical">Technical</option>
          <option value="non-technical">Non-Technical</option>
        </select>
        <input id="search" type="text" placeholder="Search name / reg no / email..."
               class="bg-[#0f172a] border border-white/10 rounded-lg px-3 py-2 text-xs w-56 focus:outline-none focus:border-cyan-500">
        <a href="/admin/export.csv" class="text-xs bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-2 rounded-lg">Export CSV</a>
        <a href="/admin/logout" class="text-xs bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-300 px-4 py-2 rounded-lg">Log Out</a>
      </div>
    </div>

    <div class="glass rounded-2xl overflow-x-auto">
      <table class="w-full min-w-[1300px]">
        <thead>
          <tr>
            <th>Reg ID</th>
            <th>Name</th>
            <th>Reg No</th>
            <th>College</th>
            <th>Department</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Track</th>
            <th>Event</th>
            <th>Txn ID</th>
            <th>Screenshot</th>
            <th>Submitted</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty-state" class="text-center text-gray-500 text-sm py-10 hidden">No registrations yet.</p>
    </div>
  </div>

<script>
let allRows = [];

async function fetchData() {
  try {
    const res = await fetch('/admin/api/registrations');
    if (res.status === 401 || res.redirected) { window.location.href = '/admin/login'; return; }
    allRows = await res.json();
    render();
  } catch (e) { console.error(e); }
}

function badge(status) {
  return `<span class="badge badge-${status}">${status}</span>`;
}

function trackBadge(category) {
  const label = category === 'non-technical' ? 'Non-Technical' : 'Technical';
  const color = category === 'non-technical' ? 'background:rgba(168,85,247,.15);color:#a855f7;' : 'background:rgba(34,211,238,.15);color:#22d3ee;';
  return `<span class="badge" style="${color}">${label}</span>`;
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const cat = document.getElementById('category-filter').value;
  const filtered = allRows.filter(r =>
    (!q || r.name.toLowerCase().includes(q) || r.reg_no.toLowerCase().includes(q) || r.email.toLowerCase().includes(q) || r.event.toLowerCase().includes(q)) &&
    (!cat || r.category === cat)
  );

  document.getElementById('count-label').textContent = `· ${allRows.length} total`;
  document.getElementById('empty-state').classList.toggle('hidden', filtered.length !== 0);

  document.getElementById('rows').innerHTML = filtered.map(r => `
    <tr>
      <td class="font-mono text-cyan-300">${escapeHtml(r.reg_id)}</td>
      <td class="font-semibold">${escapeHtml(r.name)}</td>
      <td>${escapeHtml(r.reg_no)}</td>
      <td>${escapeHtml(r.college)}</td>
      <td>${escapeHtml(r.department)}</td>
      <td class="text-gray-400">${escapeHtml(r.mobile)}</td>
      <td class="text-gray-400">${escapeHtml(r.email)}</td>
      <td>${trackBadge(r.category)}</td>
      <td class="font-semibold">${escapeHtml(r.event)}</td>
      <td class="text-gray-400">${escapeHtml(r.transaction_id)}</td>
      <td><a href="/admin/screenshot/${r.id}" target="_blank" class="text-cyan-400 hover:underline">View</a></td>
      <td class="text-gray-500 whitespace-nowrap">${new Date(r.submitted_at).toLocaleString()}</td>
      <td>
        <select onchange="updateStatus(${r.id}, this.value)">
          <option value="pending" ${r.status==='pending'?'selected':''}>Pending</option>
          <option value="approved" ${r.status==='approved'?'selected':''}>Approved</option>
          <option value="rejected" ${r.status==='rejected'?'selected':''}>Rejected</option>
        </select>
      </td>
    </tr>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function updateStatus(id, status) {
  await fetch(`/admin/update-status/${id}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status }),
  });
  fetchData();
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('category-filter').addEventListener('change', render);

fetchData();
setInterval(fetchData, 8000);
</script>
</body>
</html>
