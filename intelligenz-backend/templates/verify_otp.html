<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email | {{ event_name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  body { background:#030712; color:#fff; font-family:'Inter',sans-serif; min-height:100vh; }
  .display { font-family:'Space Grotesk',sans-serif; }
  .glass { background:rgba(15,23,42,.5); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.08); }
  .grad { background-image:linear-gradient(to right,#22d3ee,#a855f7); }
  input { background:rgba(3,7,18,.6); border:1px solid rgba(255,255,255,.12); color:#fff; letter-spacing:.5em; text-align:center; }
  input:focus { outline:none; border-color:#22d3ee; box-shadow:0 0 0 2px rgba(34,211,238,.25); }
</style>
</head>
<body class="flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <p class="text-cyan-400 text-xs tracking-[0.3em] uppercase mb-1">Step 2 of 3</p>
      <h1 class="display text-3xl font-bold">Verify Your Email</h1>
      <p class="text-gray-400 text-sm mt-2">We sent a 6-digit code to <span class="text-white font-semibold">{{ email }}</span></p>
    </div>

    <form method="POST" class="glass rounded-2xl p-6 sm:p-8 space-y-4">
      {% if error %}
        <div class="bg-red-500/10 border border-red-500/40 text-red-300 text-sm rounded-lg px-4 py-3">{{ error }}</div>
      {% endif %}
      {% if info %}
        <div class="bg-cyan-500/10 border border-cyan-500/40 text-cyan-300 text-sm rounded-lg px-4 py-3">{{ info }}</div>
      {% endif %}

      <div>
        <input type="text" name="otp" required maxlength="6" pattern="[0-9]{6}" inputmode="numeric"
               class="w-full rounded-lg px-4 py-4 text-2xl font-bold" placeholder="000000" autofocus>
      </div>

      <button type="submit"
        class="w-full grad text-white font-bold py-3 rounded-lg tracking-wide hover:opacity-90 transition">
        Verify Code
      </button>
    </form>

    <form method="POST" action="/resend-otp" class="mt-4 text-center">
      <button type="submit" class="text-xs text-gray-400 hover:text-cyan-400 underline">Resend code</button>
    </form>
  </div>
</body>
</html>
